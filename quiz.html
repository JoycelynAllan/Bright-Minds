<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhizKids Quiz Zone</title>
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>
  <header>
    <h1>🧠 BrightMinds Quiz Zone 🧩</h1>
    <p>Let’s see how smart you are today!</p>
  </header>

  <main>
    <div class="quiz-container">
      <div id="question-container">
        <h2 id="question">Loading question...</h2>
        <div id="options" class="options"></div>
      </div>

      <button id="next-btn" class="next-btn">Next ➡️</button>

      <div id="score-container" class="hidden">
        <h2>Your Score 🎉</h2>
        <p id="score"></p>
        <button id="restart-btn" class="restart-btn">Play Again 🔁</button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 BrightMinds. Keep learning and having fun!</p>
  </footer>

  <script src="quiz.js"></script>
</body>
</html>
